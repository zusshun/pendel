# Historical backtests use public market data only, with no live trading or authentication.
symbols = ["INTC", "DRAM", "CRCL"]
quote_center = "binance_basis"

# Use decimal strings for amounts and rates. Price and quantity steps are explicit simulation assumptions.
quote_notional = "800"
max_inventory_usd = "1600"
principal_usd = "1000"
quote_offset_bps = "10"
price_tick = "0.01"
quantity_step = "0.1"
# Pair each observed trade with a fresh Binance price; retain the latest 20 samples per trade side.
# Use samples no older than 6 hours. The basis is the mean of the two side medians; trades need not be simultaneous.
basis_pair_max_age_s = "30"
basis_samples = 20
max_basis_age_s = "21600"
max_ref_age_s = "120"
# When the Binance reference expires, default to the midpoint of recent buy/sell trade medians; none suspends quoting.
ref_fallback = "ondo_mid"
max_ondo_mid_age_s = "1800"
# Order book midpoints expire after 120 seconds; markouts wait up to 1800 seconds after the target for a valid center price.
max_depth_age_s = "120"
markout_max_delay_s = "1800"
data_latency_ms = 100
place_latency_ms = 500
cancel_latency_ms = 500
requote_bps = "2"
requote_mode = "cancel_first"
at_price_fill_ratio = "0.5"
at_price_fill_ratios = ["0", "0.5", "1"]
# Allow the full remaining quantity of active orders to fill when an observed Binance move creates enough arbitrage edge.
pickoff_enabled = true
pickoff_edge_bps = "2.5"

# Hedge mode must be none or lighter_proxy; Lighter execution prices are proxy assumptions.
hedge_mode = "none"
hedge_latency_ms = 500
lighter_basis_bps = "0"
lighter_half_spread_bps = "1"
hedge_slippage_bps = "1"
guard_window_s = "10"
guard_move_bps = "20"
guard_latency_ms = 100
guard_cooldown_s = "30"

# 1 bps = 0.01%; all fees and funding rates below are scenario assumptions.
ondo_maker_fee_bps = "1"
ondo_taker_fee_bps = "2.5"
lighter_taker_fee_bps = "2.5"
ondo_half_spread_bps = "1"
# Forced exits prefer half the symbol's median observed spread; the setting above is a fallback when observations are unavailable.
ondo_funding_bps_per_hour = "0"
lighter_funding_bps_per_hour = "0"

# Reward rules are unconfirmed; results apply only if these assumptions hold.
# reward_markets assumes how many markets share the pool; 87 is the contract count in the design notes.
pool_usdc_per_week = "110000"
reward_markets = 87
band_bps = "25"
reward_weight = "flat"
reward_two_sided = true
min_quote_usd = "0"
reward_mid_error_bps = "0"
# Also report rewards under the following reward-midpoint error scenarios, in bps.
reward_mid_error_scenarios = ["0", "10", "20"]
comp_source = "scenarios"
comp_scenarios = ["1000", "3000", "10000", "30000", "100000", "300000", "1000000", "4000000"]
request_interval_ms = 250
http_timeout_s = "5"

# Weekdays run from 0 (Monday) to 6 (Sunday); hours use Beijing time, with automatic week wraparound.
[named_periods."周末"]
start_weekday = 5
start_hour = 9
end_weekday = 0
end_hour = 5

# Symbols without overrides use the default precision; Binance symbols default to {SYM}USDT.
[symbol_overrides.INTC]
price_tick = "0.01"
quantity_step = "0.1"
binance_symbol = "INTCUSDT"

[symbol_overrides.DRAM]
price_tick = "0.01"
quantity_step = "0.1"

[symbol_overrides.CRCL]
price_tick = "0.01"
quantity_step = "0.1"
