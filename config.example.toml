# The first version records public market data and runs offline simulations, without accounts or keys.
symbol = "INTC"
ondo_market = "INTC-USD.P"
poll_interval_s = 2.0
http_timeout_s = 5.0
depth = 50

# Use decimal strings for amounts and rates to avoid floating-point rounding.
# Ondo price and quantity steps are explicit simulation assumptions; verify them independently.
quote_notional = "100"
quote_offset_bps = "10"
price_tick = "0.01"
quantity_step = "0.1"
cancel_latency_ms = 500
hedge_latency_ms = 500

max_stale_ms = 6000
max_skew_ms = 2000
max_basis_bps = "50"
max_jump_bps = "100"
max_inventory_usd = "300"
max_net_usd = "150"
max_loss_usd = "10"
max_hedge_slippage_bps = "20"
extra_slippage_bps = "1"

# 1 bps = 0.01%; all values are scenario assumptions, not actual historical fees.
ondo_maker_fee_bps = "1"
lighter_taker_fee_bps = "0"
# Positive rates mean longs pay and shorts receive; actual exchange settlement times are not modeled.
ondo_funding_bps_per_hour = "0"
lighter_funding_bps_per_hour = "0"

# Omit for unknown rewards. This is a user-supplied scenario, not a prediction of the official reward share.
# reward_usdc = "5"
