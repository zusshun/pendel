# Read-only public market data collection; no account or keys required. Copy to collect.toml and adjust.
# Focus symbols retain full order books, subscribe to Binance trades, and poll Lighter; Ondo trades cover all markets.
# Use uppercase symbols. The legacy focus_symbols key is supported; both keys must agree if present.
focus_markets = ["INTC", "DRAM", "CRCL", "WEN", "NKE", "RDDT", "IBM", "DKNG"]

# Full order book snapshot interval for focus markets, in seconds; derived competition records cover all markets every minute.
focus_snapshot_s = "1"
other_snapshot_s = "60"
# Save contract and precision snapshots every 5 minutes; set the all-market REST fallback scan interval for Ondo WS gaps.
contracts_interval_s = "300"
rest_scan_interval_s = "60"
# Refresh Lighter metadata hourly; warn once for unsupported symbols and reassess after the next refresh.
lighter_poll_s = "2"
lighter_meta_refresh_s = "3600"
# Seconds without valid market data across a connection or channel before recording a gap; backtests suspend quoting during gaps.
silence_timeout_s = "30"
# Seconds without updates for one market/channel before recording market_stale; tracks quality without suspending backtest quotes.
market_stale_s = "600"
# Seconds without valid data from a connected source before writing a Chinese warning to the health log.
source_silence_warn_s = "180"
# Send Ondo application heartbeats every 30 seconds; proactively reconnect Binance after 23 hours.
ondo_ping_s = "30"
binance_reconnect_s = "82800"
# Exchanges may migrate WS endpoints; check and update these settings if connections succeed but no data arrives.
# The Binance URL ends in streams=; the collector appends aggTrade subscriptions for configured symbols.
binance_ws_url = "wss://fstream.binance.com/market/stream?streams="
ondo_ws_url = "wss://api.ondoperps.xyz/ws"

# Relative paths use the command's current working directory, or WorkingDirectory under systemd.
data_dir = "data/collect"
log_dir = "log"
# Flush and exit with code 75 when compressed data in the collection directory reaches this GB limit; keep existing data.
max_disk_gb = "20"
# Also flush and exit (75) when free space falls below this GB threshold; rescan total directory usage every 10 minutes.
min_free_gb = "2"
# Bound HTTP concurrency and the write queue; configure the HTTP timeout and request interval (milliseconds).
max_http_workers = 4
write_queue_size = 1024
http_timeout_s = "5"
request_interval_ms = 250

# Ondo supports up to 100 levels; competition bands and tick depth use the same definitions as scan_import.
depth = 100
band_bps = "25"
max_tick_depth = 10
price_tick = "0.01"
quantity_step = "0.1"

# Matching names do not guarantee the same asset. Binance symbols default to {SYM}USDT; verify the corresponding contract.
# Example symbol override (uncomment to enable; verify mappings before use):
# [symbol_overrides.INTC]
# price_tick = "0.01"
# quantity_step = "0.1"
# binance_symbol = "INTCUSDT"
